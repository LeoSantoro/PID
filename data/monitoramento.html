<!DOCTYPE html>
<html lang='pt-BR'>

<head>
  <title>Monitoramento</title>
  <meta charset='UTF-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f0f4f8;
      color: #333;
      height: 100vh;
      width: 100%;
    }

    .cabecalho {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px 20px;
      background-color: #004080;
      color: white;
      width: 100%;
    }

    .cabecalho h1 {
      margin: 0;
      font-size: 24px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 10px 20px;
      background-color: #e6f2ff;
      border-bottom: 2px solid #0059b3;
      width: 100%;
      font-size: 16px;
    }

    .breadcrumb a {
      text-decoration: none;
      color: #0059b3;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .breadcrumb a:hover {
      color: #0073e6;
    }

    .breadcrumb span {
      color: #333;
    }

    .container {
      width: 80vw;
      margin: 20px auto;
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    #chart-temperature {
      height: 300px;
    }

    .info-grafico {
      margin-top: 20px;
      padding: 15px;
      background-color: #e6f2ff;
      border-left: 4px solid #004080;
      border-radius: 6px;
      font-size: 16px;
    }

    .info-grafico strong {
      color: #004080;
    }

    .botoes {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .botoes button {
      margin: 5px;
      padding: 10px 15px;
      color: white;
      background-color: #0059b3;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .botoes button:hover {
      background-color: #0073e6;
    }

    @media (max-width: 768px) {
      .cabecalho h1 {
        font-size: 20px;
      }

      #chart-temperature {
        height: 250px;
      }

      .info-grafico {
        font-size: 14px;
      }

      .botoes button {
        width: 100%;
        max-width: 300px;
      }
    }

    @media (max-width: 480px) {
      .cabecalho h1 {
        font-size: 18px;
      }

      .info-grafico {
        font-size: 13px;
      }

      #chart-temperature {
        height: 200px;
      }
    }
  </style>
  <script src="highcharts.js"></script>
  <script src="https://code.highcharts.com/modules/data.js"></script>
  <script src="https://code.highcharts.com/modules/exporting.js"></script>
</head>

<body>
  <div class="cabecalho">
    <h1>Monitoramento</h1>
  </div>
  <div class="breadcrumb">
    <a href="/">Parâmetros</a>
    <span>&gt;</span>
    <span>Monitoramento</span>
    <span>&gt;</span>
    <a href="/calibracao">Calibração</a>
  </div>
  <div class="container">
    <div id="chart"></div>
    <div class="info-grafico" id="info-grafico">
      <strong>Informações do Gráfico:</strong>
      <p>Setpoint: <span id="info-setpoint">-</span></p>
      <p>KP: <span id="info-kp">-</span></p>
      <p>KI: <span id="info-ki">-</span></p>
      <p>KD: <span id="info-kd">-</span></p>
    </div>
    <div class="botoes">
      <button onclick="start()">Começar</button>
      <button onclick="stop()">Parar</button>
      <button onclick="limpar()">Limpar</button>
    </div>
  </div>
</body>

<script>
  var chartT = new Highcharts.Chart({
    chart: {
      renderTo: 'chart',
      type: 'line',
      backgroundColor: '#f7fbff',
    },
    title: { text: 'Controlador em Tempo Real' },
    series: [{
      name: 'Dados',
      data: []
    }],
    xAxis: {
      type: 'datetime',
      dateTimeLabelFormats: { second: '%H:%M:%S' },
      title: { text: 'Tempo' },
      lineColor: '#004080',
      tickColor: '#004080',
      labels: {
        formatter: function () {
          // Formata o valor do eixo X para MM:SS
          var totalSeconds = this.value / 1000; // Converte milissegundos para segundos
          var minutes = Math.floor(totalSeconds / 60);
          var seconds = Math.floor(totalSeconds % 60);
          return minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
        }
      }
    },
    yAxis: {
      title: { text: 'Posição (Graus)' },
      max: 100,
      min: 0,
      gridLineColor: '#d9e6f2',
    },
    credits: { enabled: false },
    plotOptions: {
      line: {
        animation: false,
        dataLabels: { enabled: false },
        marker: { enabled: false }
      },
      series: { color: '#0073e6' }
    },
    tooltip: {

      formatter: function () {
        var totalSeconds = this.x / 1000; // Converte milissegundos para segundos
        var minutes = Math.floor(totalSeconds / 60);
        var seconds = totalSeconds % 60;
        return (
          '<b>Tempo:</b> ' + minutes + ':' + (seconds < 10 ? '0' : '') + seconds +
          '<br><b>Posição:</b> ' + this.y + '°'
        );
      }
    }
  });

  function myfunc() {
    const urlParams = new URLSearchParams(window.location.search);
    const setpoint = urlParams.get("setpoint") || "Não definido";
    const kp = urlParams.get("kp") || "Não definido";
    const ki = urlParams.get("ki") || "Não definido";
    const kd = urlParams.get("kd") || "Não definido";

    document.getElementById('info-setpoint').textContent = setpoint;
    document.getElementById('info-kp').textContent = kp;
    document.getElementById('info-ki').textContent = ki;
    document.getElementById('info-kd').textContent = kd;
  }

  function start() {
    console.log("Start");
    var request = new XMLHttpRequest();
    request.open("GET", "/start", true);
    request.send();
  }

  function stop() {
    console.log("Stop");
    var request = new XMLHttpRequest();
    request.open("GET", "/stop", true);
    request.send();
  }

  function limpar() {
    chartT.series[0].setData([]);
  }

  if (!!window.EventSource) {
    var source = new EventSource('/events');
    source.addEventListener('atualiza', function (e) {
      var dados = JSON.parse(e.data);
      var x = parseFloat(dados[0]);
      var y = parseInt(dados[1]);
      chartT.series[0].addPoint([x, y], true, false, true);  //addPoint(options [, redraw] [, shift] [, animation] [, withEvent])
    }, false);
  }

  myfunc();
</script>

</html>
