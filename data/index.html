<!DOCTYPE html>
<html lang='pt-BR'>

<head>
  <title>Parâmetros</title>
  <meta charset='UTF-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
     body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f0f4f8;
      color: #333;
      overflow: hidden;
      height: 100vh;
      width: 100%;
    }

    .cabecalho {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px 20px;
      background-color: #004080;
      color: white;
      width: 100%;
    }

    .cabecalho h1 {
      margin: 0;
      font-size: 24px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 10px 20px;
      background-color: #e6f2ff;
      border-bottom: 2px solid #0059b3;
      width: 100%;
      font-size: 16px;
    }

    .breadcrumb a {
      text-decoration: none;
      color: #0059b3;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .breadcrumb a:hover {
      color: #0073e6;
    }

    .breadcrumb span {
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      margin-top: 10vh;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 16px;
      margin-bottom: 5px;
      color: #333;
    }

    input {
      margin-bottom: 15px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    input[type="submit"] {
      background-color: #0059b3;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #0073e6;
    }

    @media (max-width: 768px) {
      .cabecalho h1 {
        font-size: 20px;
      }

      .container {
        padding: 15px;
      }

      input {
        font-size: 14px;
      }

      input[type="submit"] {
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .cabecalho h1 {
        font-size: 18px;
      }

      label {
        font-size: 14px;
      }

      input {
        font-size: 12px;
      }

      input[type="submit"] {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="cabecalho">
    <h1>Parâmetros</h1>
  </div>
  <div class="breadcrumb">
    <span>Parâmetros</span>
    <span>&gt;</span>
    <p>Monitoramento</p>
    <span>&gt;</span>
    <a href="/calibracao">Calibração</a>
  </div>
  <div class="container">
    <form id="valores" action="/monitoramento">
      <label for="setpoint">SetPoint (graus):</label>
      <input type="number" id="setpoint" name="setpoint" required>

      <label for="kp">Proporcional (Kp):</label>
      <input type="number" id="kp" name="kp" step="0.001" required>

      <label for="ki">Integral (Ki):</label>
      <input type="number" id="ki" name="ki" step="0.001" required>

      <label for="kd">Derivativo (Kd):</label>
      <input type="number" id="kd" name="kd" step="0.001" required>

      <input type="submit" value="Confirmar">
    </form>
  </div>
</body>

</html>
