<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <title>Calibração</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f0f4f8;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      width: 100%;
    }

    .cabecalho {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px 20px;
      background-color: #004080;
      color: white;
      width: 100%;
      position: fixed;
      top: 0;
    }

    .cabecalho h1 {
      margin: 0;
      font-size: 24px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 10px 20px;
      background-color: #e6f2ff;
      border-bottom: 2px solid #0059b3;
      width: 100%;
      position: fixed;
      top: 60px;
      font-size: 16px;
      margin-left: 16px;
    }

    .breadcrumb a {
      text-decoration: none;
      color: #0059b3;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .breadcrumb a:hover {
      color: #0073e6;
    }

    .breadcrumb span {
      color: #333;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin-top: 120px;
      padding: 20px;
      width: 100%;
      max-width: 800px;
    }

    .opcoes {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
      width: 100%;
    }

    .opcao {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 300px;
      height: 500px;
      border: 2px solid #ccc;
      border-radius: 8px;
      background-color: transparent;
      cursor: pointer;
      transition: border-color 0.3s ease;
    }

    .opcao img {
      max-width: 80%;
      max-height: 60%;
      margin-bottom: 10px;
    }

    .opcao.selected {
      border-color: #0073e6;
      background-color: rgba(0, 115, 230, 0.1);
    }

    .opcao p {
      margin: 0;
      font-size: 18px;
      color: #333;
    }

    .botao-calibrar {
      padding: 15px 30px;
      background-color: #0059b3;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .botao-calibrar:hover {
      background-color: #0073e6;
    }

    @media (max-width: 768px) {
      .opcoes {
        flex-direction: column;
        gap: 20px;
      }

      .opcao {
        width: 100%;
        height: 300px;
      }
    }
  </style>
  <script>
    let selectedOption = null;

    function selectOption(optionId) {
      if (selectedOption) {
        document.getElementById(selectedOption).classList.remove("selected");
      }
      selectedOption = optionId;
      document.getElementById(optionId).classList.add("selected");
    }

    function calibrar() {
      if (!selectedOption) {
        alert("Por favor, selecione uma opção antes de calibrar.");
        return;
      }
      const message = selectedOption === "opcao1" ? "Calibrado para 0°" : "Calibrado para 90°";
      alert(message);
      // Aqui você pode enviar a opção selecionada ao backend via fetch ou XMLHttpRequest.
    }
  </script>
</head>

<body>
  <div class="cabecalho">
    <h1>Calibração</h1>
  </div>

  <div class="breadcrumb">
    <a href="/">Parâmetros</a>
    <span>&gt;</span>
    <p>Monitoramento</p>
    <span>&gt;</span>
    <span>Calibração</span>
  </div>

  <div class="container">
    <div class="opcoes">
      <div id="opcao1" class="opcao" onclick="selectOption('opcao1')">
        <img src="https://via.placeholder.com/150" alt="Imagem 1">
        <p>Calibrar para 0°</p>
      </div>
      <div id="opcao2" class="opcao" onclick="selectOption('opcao2')">
        <img src="https://via.placeholder.com/150" alt="Imagem 2">
        <p>Calibrar para 90°</p>
      </div>
    </div>
    <button class="botao-calibrar" onclick="calibrar()">Calibrar</button>
  </div>
</body>

</html>
